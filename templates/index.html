<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperMind · CV 异常检测论文问答</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#2a2f3d; --fg:#e8eaf0;
          --muted:#9aa3b5; --accent:#6c8cff; --accent2:#4f6ef7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:"PingFang SC",
         "Microsoft YaHei", system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:880px; margin:0 auto; padding:32px 20px 60px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:6px; }
  h1 { font-size:26px; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  .card h2 { font-size:14px; color:var(--muted); font-weight:600;
             margin-bottom:12px; letter-spacing:.5px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; }
  .pill { background:#1e2330; border:1px solid var(--line); border-radius:999px;
          padding:5px 12px; font-size:12.5px; color:var(--muted); }
  .pill b { color:var(--fg); font-weight:600; }
  textarea { width:100%; background:#11141c; color:var(--fg);
             border:1px solid var(--line); border-radius:8px;
             padding:12px 14px; font-size:14.5px; resize:vertical;
             min-height:64px; outline:none; line-height:1.6; }
  textarea:focus { border-color:var(--accent); }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;
         align-items:center; }
  button { background:var(--accent2); border:none; color:#fff;
           border-radius:8px; padding:10px 22px; font-size:14px;
           cursor:pointer; transition:.15s; }
  button:hover { background:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line);
                 color:var(--muted); }
  button.ghost:hover { border-color:var(--accent); color:var(--fg); }
  #drop { border:1.5px dashed var(--line); border-radius:10px;
          padding:22px; text-align:center; color:var(--muted);
          font-size:13.5px; transition:.15s; cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #answer { font-size:14.5px; line-height:1.85; white-space:pre-wrap; }
  .src { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  .src-item { font-size:12.5px; color:var(--muted); margin-bottom:8px;
              line-height:1.55; }
  .src-item b { color:var(--accent); }
  .tag { display:inline-block; background:#1e2330; border:1px solid var(--line);
         border-radius:4px; padding:1px 7px; margin-right:6px; font-size:11.5px; }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  .ok { color:#67c98a; } .err { color:#e06c6c; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Paper<span>Mind</span></h1></header>
  <div class="sub">计算机视觉异常检测论文 RAG 问答系统 · 检索增强生成 · 引用可溯源</div>

  <div class="card">
    <h2>知识库状态</h2>
    <div class="stats" id="stats">加载中…</div>
  </div>

  <div class="card">
    <h2>上传论文（PDF / TXT / MD，支持多选与拖拽）</h2>
    <div id="drop">点击选择或将文件拖到这里，上传后自动摄入知识库</div>
    <input type="file" id="file" multiple accept=".pdf,.txt,.md" hidden>
    <div class="hint" id="upmsg"></div>
  </div>

  <div class="card">
    <h2>提问</h2>
    <textarea id="q" placeholder="例如：PatchCore 是如何用 memory bank 做异常检测的？"></textarea>
    <div class="row">
      <button id="ask">提问</button>
      <button class="ghost" id="demo">示例问题</button>
      <span class="hint" id="qmsg"></span>
    </div>
  </div>

  <div class="card" id="anscard" hidden>
    <h2>回答</h2>
    <div id="answer"></div>
    <div class="src" id="sources"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function refreshStats() {
  const r = await fetch('/api/stats').then(r => r.json());
  $('stats').innerHTML =
    `<span class="pill">文本块 <b>${r.chunks}</b></span>` +
    `<span class="pill">文档 <b>${r.sources.length}</b></span>` +
    `<span class="pill">嵌入模式 <b>${r.embed_mode}</b></span>` +
    `<span class="pill">生成模型 <b>${r.llm_model}</b></span>` +
    (r.sources||[]).map(s=>`<span class="pill">${s}</span>`).join('');
}
async function ask() {
  const q = $('q').value.trim();
  if (!q) return;
  $('ask').disabled = true; $('qmsg').textContent = '检索 + 生成中…';
  $('anscard').hidden = false; $('answer').textContent = '思考中…'; $('sources').innerHTML = '';
  try {
    const r = await fetch('/api/query', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q})}).then(r=>r.json());
    if (!r.ok) throw new Error(r.error);
    $('answer').textContent = r.answer;
    $('sources').innerHTML = '<h2>引用来源</h2>' + (r.sources||[]).map((s,i) =>
      `<div class="src-item"><span class="tag">[${i+1}] ${s.score}</span>` +
      `<b>${s.source}</b> · 块${s.seq}<br>${s.snippet}…</div>`).join('') +
      `<div class="hint">嵌入:${r.embed_mode} | 模型:${r.model} | 耗时:${r.elapsed}s</div>`;
    $('qmsg').innerHTML = `<span class="ok">完成 (${r.elapsed}s)</span>`;
  } catch (e) {
    $('answer').textContent = '出错了：' + e.message;
    $('qmsg').innerHTML = `<span class="err">失败</span>`;
  } finally { $('ask').disabled = false; }
}
async function upload(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append('files', f));
  $('upmsg').textContent = '上传并嵌入中（首次会下载本地嵌入模型）…';
  const r = await fetch('/api/ingest', {method:'POST', body:fd}).then(r=>r.json());
  if (r.ok) {
    const s = r.stats;
    $('upmsg').innerHTML = `<span class="ok">已摄入 ${s.docs} 篇 → ${s.chunks} 块 ` +
      `(${s.embed_mode}, ${s.elapsed}s)</span>`;
    refreshStats();
  } else $('upmsg').innerHTML = `<span class="err">失败</span>`;
}
$('ask').onclick = ask;
$('q').addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) ask(); });
$('demo').onclick = () => { $('q').value = 'PatchCore 是如何利用 memory bank 和 coreset 做工业异常检测的？和 PaDiM 相比有什么优势？'; };
$('drop').onclick = () => $('file').click();
$('file').onchange = e => upload(e.target.files);
['dragover','dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault();
  $('drop').classList.toggle('over', ev==='dragover');
  if (ev==='drop') upload(e.dataTransfer.files);
}));
refreshStats();
</script>
</body>
</html>
